spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bank_system?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: v+5URk6hJjetRNeBxY6RcpJ3mjL0DquxC8x7luDJqW8=
  expiration-ms: 86400000 # 24시간

pg:
  api:
    url: http://localhost:8081

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10000ms
        failureRateThreshold: 50
    instances:
      pgCircuitBreaker:
        baseConfig: default